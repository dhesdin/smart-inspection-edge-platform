name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          # one cache per job: otherwise the light lint cache is saved first and the test job never caches torch
          cache-suffix: lint

      - name: Install dependencies
        # core + dev only, exact versions from uv.lock (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test

      - name: Install dependencies
        # CPU-only torch build (no GPU on the runner), same versions as the workstation for everything else
        run: uv sync --locked --extra train --extra cpu --extra dev

      - name: Run unit tests
        # integration tests need the MVTec dataset and pretrained weights: run them locally with `make test`
        run: uv run --no-sync pytest -q -m "not integration"
